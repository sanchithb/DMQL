      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitAddClue()">Add Clue</button>
    </div>`);
      };

      window.submitAddClue = async function () {
        const body = {
          game_id: parseInt(document.getElementById("clf_game").value),
          clue_text: document.getElementById("clf_text").value,
          time_penalty:
            parseInt(document.getElementById("clf_penalty").value) || 0,
        };
        if (!body.clue_text) return showToast("Enter clue text", "error");
        await api("/clues", { method: "POST", body });
        showToast("Clue added!");
        closeModal();
        cluesState.data = null;
        loadClues();
      };

      window.deleteClue = function (id) {
        state.confirmDialog = {
          title: "Delete Clue",
          msg: "Remove this clue?",
          onConfirm: async () => {
            await api(`/clues/${id}`, { method: "DELETE" });
            showToast("Clue deleted");
            state.confirmDialog = null;
            cluesState.data = null;
            loadClues();
          },
          onCancel: () => {
            state.confirmDialog = null;
            render();
          },
        };
        render();
      };

      // ══════════════════════════════════════════════════════════════════════════════
      //  ANALYTICS
      // ══════════════════════════════════════════════════════════════════════════════
      let analyticsState = { tab: "revenue", data: {}, loading: {} };

      async function loadAnalytics(tab) {
        analyticsState.loading[tab] = true;
        render();
        const endpoints = {
          revenue: "/analytics/revenue?period=monthly",
          gamePerf: "/analytics/game-performance",
          empPerf: "/analytics/employee-performance",
          trends: "/analytics/booking-trends",
          payments: "/analytics/payment-breakdown",
          customers: "/analytics/customer-insights",
          clues: "/analytics/clue-usage",
        };
        if (endpoints[tab]) {
          analyticsState.data[tab] = await api(endpoints[tab]);
          analyticsState.loading[tab] = false;
          render();
        }
      }

      window.analyticsTab = (t) => {
        analyticsState.tab = t;
        if (!analyticsState.data[t]) loadAnalytics(t);
        render();
      };

      function renderAnalytics() {
        const tab = analyticsState.tab;
        if (!analyticsState.data[tab] && !analyticsState.loading[tab])
          loadAnalytics(tab);

        const tabs = [
          { id: "revenue", label: "💰 Revenue" },
          { id: "gamePerf", label: "🎮 Game Performance" },
          { id: "empPerf", label: "👷 Employee Stats" },
          { id: "trends", label: "📅 Booking Trends" },
          { id: "payments", label: "💳 Payments" },
          { id: "customers", label: "👥 Customers" },
          { id: "clues", label: "🔍 Clue Usage" },
        ];

        return `
    <div class="page-header">
      <div><div class="page-title">Analytics & Reports</div><div class="page-sub">Business intelligence and performance metrics</div></div>
      <button class="btn btn-secondary" onclick="analyticsState.data={};loadAnalytics('${tab}')">↺ Refresh</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px">
      ${tabs.map((t) => `<button class="tab-btn ${tab === t.id ? "active" : ""}" onclick="analyticsTab('${t.id}')">${t.label}</button>`).join("")}
    </div>
    ${analyticsState.loading[tab] ? `<div class="loading"><div class="spin"></div><span>Loading data…</span></div>` : renderAnalyticsContent(tab)}`;
      }

      function renderAnalyticsContent(tab) {
        const d = analyticsState.data[tab];
        if (!d) return `<div class="loading"><div class="spin"></div></div>`;

        if (tab === "revenue") {
          const maxRev = Math.max(
            ...(d || []).map((r) => parseFloat(r.revenue) || 0),
            1,
          );
          return `
      <div class="card">
        <div class="card-title">Monthly Revenue</div>
        <div class="bar-chart">
          ${(d || [])
            .map(
              (r) => `
            <div class="bar-row">
              <span class="bar-label">${r.label}</span>
              <div class="bar-track">
                <div class="bar-fill" style="width:${Math.round((r.revenue / maxRev) * 100)}%;background:var(--accent)">
                  <span>${fmtMoney(r.revenue)}</span>
                </div>
              </div>
              <span style="font-size:12px;color:var(--text-muted);width:60px;text-align:right">${r.transactions} txns</span>
            </div>`,
            )
            .join("")}
        </div>
        ${d.length === 0 ? '<div class="empty-state" style="padding:20px">No revenue data yet</div>' : ""}
      </div>`;
        }

        if (tab === "gamePerf") {
          const rows = d
            .map(
              (g) => `
      <tr>
        <td><strong>${g.game_name}</strong></td>
        <td>${diffBadge(g.difficulty_level)}</td>
        <td>${fmt(g.total_sessions)}</td>
        <td>${fmt(g.successful)}</td>
        <td>
          <div class="mini-bar">
            <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${g.success_rate || 0}%"></div></div>
            <span style="font-size:12px;width:40px">${g.success_rate || 0}%</span>
          </div>
        </td>
        <td>${g.avg_duration_mins} min</td>
        <td>${fmt(g.total_clues_used)}</td>
      </tr>`,
            )
            .join("");
          return `
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:18px 20px"><div class="card-title" style="margin:0">Game Performance Summary</div></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table>
            <thead><tr><th>Game</th><th>Difficulty</th><th>Sessions</th><th>Escaped</th><th>Success Rate</th><th>Avg Duration</th><th>Clues Used</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="7"><div class="empty-state" style="padding:20px">No session data</div></td></tr>'}</tbody>
          </table>
        </div>
      </div>`;
        }

        if (tab === "empPerf") {
          const maxSessions = Math.max(
            ...(d || []).map((e) => e.sessions_conducted || 0),
            1,
          );
          return `
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:18px 20px"><div class="card-title" style="margin:0">Employee Performance</div></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table>
            <thead><tr><th>Name</th><th>Role</th><th>Sessions</th><th>Hours Worked</th><th>Total Paid</th><th>Leaves</th><th>Activity</th></tr></thead>
            <tbody>${(d || [])
              .map(
                (e) => `
              <tr>
                <td><strong>${e.name}</strong></td>
                <td>${statusBadge(e.role)}</td>
                <td>${fmt(e.sessions_conducted)}</td>
                <td>${fmt(e.total_hours)}h</td>
                <td>${fmtMoney(e.total_salary_paid)}</td>
                <td>${e.leave_days} days</td>
                <td>
                  <div class="mini-bar">
                    <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${Math.round((e.sessions_conducted / maxSessions) * 100)}%"></div></div>
                  </div>
                </td>
              </tr>`,
              )
              .join("")}
            </tbody>
          </table>
        </div>
      </div>`;
        }

        if (tab === "trends") {
          const maxTotal = Math.max(...(d || []).map((r) => r.total || 0), 1);
          return `
      <div class="card">
        <div class="card-title">Bookings by Day of Week</div>
        <div class="bar-chart">
          ${(d || [])
            .map(
              (r) => `
            <div class="bar-row">
              <span class="bar-label">${r.day_of_week}</span>
              <div class="bar-track">
                <div class="bar-fill" style="width:${Math.round((r.total / maxTotal) * 100)}%;background:var(--blue)">
                  <span>${r.total}</span>
                </div>
              </div>
              <span style="font-size:11px;color:var(--text-muted);white-space:nowrap">✓${r.completed || 0} ✕${r.cancelled || 0}</span>
            </div>`,
            )
            .join("")}
        </div>
      </div>`;
        }

        if (tab === "payments") {
          const { by_method = [], by_status = [] } = d;
          const maxMethod = Math.max(
            ...by_method.map((x) => parseFloat(x.total) || 0),
            1,
          );
          return `
      <div class="grid-2">
        <div class="card">
          <div class="card-title">Revenue by Payment Method</div>
          <div class="bar-chart">
            ${by_method
              .map(
                (m) => `
              <div class="bar-row">
                <span class="bar-label">${m.payment_method}</span>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${Math.round((m.total / maxMethod) * 100)}%;background:var(--purple)">
                    <span>${fmtMoney(m.total)}</span>
                  </div>
                </div>
                <span style="font-size:12px;color:var(--text-muted)">${m.count} txns</span>
              </div>`,
              )
              .join("")}
          </div>
        </div>
        <div class="card">
          <div class="card-title">Transaction Status Breakdown</div>
          <div class="donut-row">
            ${by_status
              .map(
                (s) => `
              <div class="donut-item">
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="donut-dot" style="background:${s.payment_status === "SUCCESS" ? "var(--green)" : s.payment_status === "FAILED" ? "var(--red)" : "var(--yellow)"}"></div>
                  <span>${s.payment_status}</span>
                </div>
                <div style="display:flex;align-items:center;gap:12px">
                  <strong>${fmtMoney(s.total)}</strong>
                  <span class="text-muted">${s.count} txns</span>
                </div>
              </div>`,
              )
              .join("")}
          </div>
        </div>
      </div>`;
        }

        if (tab === "customers") {
          const { top_spenders = [], retention } = d;
          const maxSpend = Math.max(
            ...top_spenders.map((c) => parseFloat(c.total_spent) || 0),
            1,
          );
          return `
      <div class="grid-2">
        <div class="card">
          <div class="card-title">Top Customers by Spend</div>
          <div class="bar-chart">
            ${top_spenders
              .map(
                (c) => `
              <div class="bar-row">
                <span class="bar-label">${c.name}</span>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${Math.round((c.total_spent / maxSpend) * 100)}%;background:var(--orange)">
                    <span>${fmtMoney(c.total_spent)}</span>
                  </div>
                </div>
                <span style="font-size:12px;color:var(--text-muted)">${c.bookings} bookings</span>
              </div>`,
              )
              .join("")}
          </div>
        </div>
        <div class="card">
          <div class="card-title">Customer Retention</div>
          ${
            retention
              ? `
          <div class="donut-row" style="gap:14px">
            <div class="donut-item"><div style="display:flex;align-items:center;gap:8px"><div class="donut-dot" style="background:var(--red)"></div><span>One-time customers</span></div><strong>${fmt(retention.one_time)}</strong></div>
            <div class="donut-item"><div style="display:flex;align-items:center;gap:8px"><div class="donut-dot" style="background:var(--yellow)"></div><span>Returning (2–4 bookings)</span></div><strong>${fmt(retention.returning)}</strong></div>
            <div class="donut-item"><div style="display:flex;align-items:center;gap:8px"><div class="donut-dot" style="background:var(--green)"></div><span>Loyal (5+ bookings)</span></div><strong>${fmt(retention.loyal)}</strong></div>
          </div>`
              : '<div class="empty-state" style="padding:20px">No data</div>'
          }
        </div>
      </div>`;
        }

        if (tab === "clues") {
          const rows = d
            .map(
              (c) => `
      <tr>
        <td>${c.game_name}</td>
        <td>${c.clue_text}</td>
        <td><span class="badge ${c.time_penalty > 10 ? "badge-red" : c.time_penalty > 5 ? "badge-yellow" : "badge-green"}">+${c.time_penalty}m</span></td>
        <td><strong>${fmt(c.times_used)}</strong></td>
      </tr>`,
            )
            .join("");
          return `
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:18px 20px"><div class="card-title" style="margin:0">Most Used Clues</div></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table>
            <thead><tr><th>Game</th><th>Clue</th><th>Time Penalty</th><th>Times Used</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4"><div class="empty-state" style="padding:20px">No clue usage data</div></td></tr>'}</tbody>
          </table>
        </div>
      </div>`;
        }

        return `<div class="empty-state">No data available</div>`;
      }

      // ══════════════════════════════════════════════════════════════════════════════
      //  QUERY PLAYGROUND
      // ══════════════════════════════════════════════════════════════════════════════
      let playgroundState = {
        result: null,
        loading: false,
        error: null,
        schema: null,
        schemaExpanded: {},
      };
      const SAMPLE_QUERIES = [
        {
          label: "Revenue by Game",
          sql: `SELECT g.game_name,\n  COUNT(b.booking_id) AS total_bookings,\n  COALESCE(SUM(p.amount),0) AS revenue\nFROM games g\nLEFT JOIN bookings b ON g.game_id = b.game_id\nLEFT JOIN payments p ON b.booking_id = p.booking_id\n  AND p.payment_status = 'SUCCESS'\nGROUP BY g.game_id, g.game_name\nORDER BY revenue DESC;`,
        },
        {
          label: "Monthly Bookings",
          sql: `SELECT\n  TO_CHAR(DATE_TRUNC('month', booking_date), 'Mon YYYY') AS month,\n  COUNT(*) AS total,\n  COUNT(*) FILTER (WHERE status = 'CONFIRMED') AS confirmed,\n  COUNT(*) FILTER (WHERE status = 'COMPLETED') AS completed,\n  COUNT(*) FILTER (WHERE status = 'CANCELLED') AS cancelled\nFROM bookings\nGROUP BY DATE_TRUNC('month', booking_date)\nORDER BY DATE_TRUNC('month', booking_date) DESC;`,
        },
        {
          label: "Top Customers",
          sql: `SELECT\n  c.first_name || ' ' || c.last_name AS customer,\n  COUNT(b.booking_id) AS bookings,\n  COALESCE(SUM(p.amount), 0) AS total_spent,\n  MAX(b.booking_date) AS last_booking\nFROM customers c\nLEFT JOIN bookings b ON c.customer_id = b.customer_id\nLEFT JOIN payments p ON b.booking_id = p.booking_id\n  AND p.payment_status = 'SUCCESS'\nGROUP BY c.customer_id, c.first_name, c.last_name\nORDER BY total_spent DESC\nLIMIT 10;`,
        },
        {
          label: "Session Efficiency",
          sql: `SELECT\n  g.game_name,\n  COUNT(gs.session_id) AS sessions,\n  ROUND(AVG(\n    EXTRACT(EPOCH FROM (gs.end_time - gs.start_time))/60\n  ), 1) AS avg_minutes,\n  ROUND(100.0 * COUNT(*) FILTER (WHERE gs.success)\n    / NULLIF(COUNT(gs.session_id), 0), 1) AS escape_rate_pct\nFROM game_sessions gs\nJOIN games g ON gs.game_id = g.game_id\nGROUP BY g.game_id, g.game_name\nORDER BY escape_rate_pct DESC NULLS LAST;`,
        },
        {
          label: "Employee Workload",
          sql: `SELECT\n  e.name,\n  e.role,\n  COUNT(se.session_id) AS sessions_led,\n  COALESCE(SUM(s.total_hours), 0) AS hours_logged,\n  COALESCE(SUM(s.total_pay), 0) AS salary_paid\nFROM employees e\nLEFT JOIN session_employees se ON e.employee_id = se.employee_id\nLEFT JOIN salaries s ON e.employee_id = s.employee_id\nGROUP BY e.employee_id, e.name, e.role\nORDER BY sessions_led DESC;`,
        },
      ];

      window.loadSchema = async function () {
        if (playgroundState.schema) {
          playgroundState.schema = null;
          render();
          return;
        }
        playgroundState.schema = await api("/query/schema");
        render();
      };

      window.setSampleQuery = function (idx) {
        document.getElementById("query-editor").value = SAMPLE_QUERIES[idx].sql;
      };

      window.runQuery = async function () {
        const sql = document.getElementById("query-editor").value.trim();
        if (!sql) return;
        playgroundState.loading = true;
        playgroundState.error = null;
        render();
        try {
          playgroundState.result = await api("/query/execute", {
            method: "POST",
            body: { sql },
          });
        } catch (e) {
          playgroundState.error = e.message;
          playgroundState.result = null;
        }
        playgroundState.loading = false;
        render();
        // Re-focus editor
        setTimeout(() => {
          const el = document.getElementById("query-editor");
          if (el) el.focus();
        }, 50);
      };

      window.toggleSchema = function (tbl) {
        playgroundState.schemaExpanded[tbl] =
          !playgroundState.schemaExpanded[tbl];
        render();
      };

      function renderPlayground() {
        const schema = playgroundState.schema;
        return `
    <div class="page-header">
      <div><div class="page-title">SQL Playground</div><div class="page-sub">Write and execute custom SELECT queries against the database</div></div>
      <button class="btn btn-secondary" onclick="loadSchema()">
        ${schema ? "▲ Hide Schema" : "📋 Show Schema"}
      </button>
    </div>
    
    ${
      schema
        ? `
    <div class="card" style="margin-bottom:20px;max-height:320px;overflow-y:auto">
      <div class="card-title">Database Schema</div>
      <div class="schema-tree">
        ${Object.entries(schema)
          .map(
            ([tbl, cols]) => `
          <div>
            <div class="schema-table-name" onclick="toggleSchema('${tbl}')">
              ${playgroundState.schemaExpanded[tbl] ? "▼" : "▶"} ${tbl}
              <span style="font-weight:400;color:var(--text-muted);font-size:11px">(${cols.length} cols)</span>
            </div>
            ${
              playgroundState.schemaExpanded[tbl]
                ? cols
                    .map(
                      (c) => `
              <div class="schema-col">
                <span>${c.column_name}</span>
                <span class="schema-col-type">${c.data_type}</span>
                ${c.is_nullable === "NO" ? '<span style="color:var(--red);font-size:10px">NOT NULL</span>' : ""}
              </div>`,
                    )
                    .join("")
                : ""
            }
          </div>`,
          )
          .join("")}
      </div>
    </div>`
        : ""
    }
    
    <div class="card">
      <div class="card-title">Query Editor</div>
      <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--text-muted);align-self:center">Sample queries:</span>
        ${SAMPLE_QUERIES.map((q, i) => `<button class="btn btn-secondary btn-sm" onclick="setSampleQuery(${i})">${q.label}</button>`).join("")}
      </div>
      <textarea id="query-editor" class="query-editor" placeholder="-- Write your SELECT query here…\n-- Only SELECT, WITH, and EXPLAIN queries are allowed.\n\nSELECT * FROM customers LIMIT 10;"
        onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))runQuery()"
      >${""}</textarea>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <button class="btn btn-primary" onclick="runQuery()" ${playgroundState.loading ? "disabled" : ""}>
          ${playgroundState.loading ? "⏳ Running…" : "▶ Run Query"} <span style="font-size:11px;opacity:0.7">(Ctrl+Enter)</span>
        </button>
        <span style="font-size:12px;color:var(--text-muted)">⚠️ Read-only: SELECT queries only</span>
      </div>
      
      ${
        playgroundState.error
          ? `
        <div style="margin-top:14px;padding:12px;background:var(--red-bg);border:1px solid #fecaca;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12.5px;color:var(--red)">
          ❌ ${playgroundState.error}
        </div>`
          : ""
      }
      
      ${
        playgroundState.result
          ? `
        <div style="margin-top:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <span style="font-size:13px;font-weight:600;color:var(--green)">✓ ${fmt(playgroundState.result.rows)} row${playgroundState.result.rows !== 1 ? "s" : ""} returned</span>
          </div>
          ${
            playgroundState.result.rows > 0
              ? `
          <div class="table-wrap query-result-table" style="max-height:400px;overflow:auto">
            <table>
              <thead>
                <tr>${Object.keys(playgroundState.result.data[0] || {})
                  .map((k) => `<th>${k}</th>`)
                  .join("")}</tr>
              </thead>
              <tbody>
                ${playgroundState.result.data
                  .map(
                    (row) => `
                  <tr>${Object.values(row)
                    .map(
                      (v) =>
                        `<td style="font-family:var(--font-mono);font-size:12px">${v === null ? '<span class="text-muted">NULL</span>' : String(v)}</td>`,
                    )
                    .join("")}</tr>
                `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>`
              : '<div class="empty-state" style="padding:20px">Query returned no rows</div>'
          }
        </div>`
          : ""
      }
    </div>`;
      }

      // ══════════════════════════════════════════════════════════════════════════════
      //  RENDER ENGINE
      // ══════════════════════════════════════════════════════════════════════════════
      const NAV = [
        { id: "dashboard", label: "Dashboard", icon: "◈" },
        { section: "Operations" },
        { id: "bookings", label: "Bookings", icon: "📋" },
        { id: "sessions", label: "Sessions", icon: "🎮" },
        { id: "payments", label: "Payments", icon: "💳" },
        { section: "Management" },
        { id: "customers", label: "Customers", icon: "👥" },
        { id: "employees", label: "Employees", icon: "👷" },
        { id: "hr", label: "HR & Salaries", icon: "💵" },
        { section: "Catalog" },
        { id: "games", label: "Games & Rooms", icon: "🚪" },
        { id: "clues", label: "Clues", icon: "🔍" },
        { section: "Intelligence" },
        { id: "analytics", label: "Analytics", icon: "📊" },
        { id: "playground", label: "SQL Playground", icon: "⌨️" },
      ];

      const PAGE_TITLES = {
        dashboard: "Dashboard",
        bookings: "Bookings",
        sessions: "Sessions",
        payments: "Payments",
        customers: "Customers",
        employees: "Employees",
        hr: "HR Management",
        games: "Games & Rooms",
        clues: "Clues",
        analytics: "Analytics",
        playground: "SQL Playground",
      };

      function renderPage() {
        switch (state.tab) {
          case "dashboard":
            return renderDashboard();
          case "customers":
            return renderCustomers();
          case "employees":
            return renderEmployees();
          case "games":
            return renderGamesRooms();
          case "bookings":
            return renderBookings();
          case "sessions":
            return renderSessions();
          case "payments":
            return renderPayments();
          case "hr":
            return renderHR();
          case "clues":
            return renderClues();
          case "analytics":
            return renderAnalytics();
          case "playground":
            return renderPlayground();
          default:
            return `<div class="empty-state"><div class="empty-icon">🔒</div><p>Page not found</p></div>`;
        }
      }

      function render() {
        const navHtml = NAV.map((item) => {
          if (item.section)
            return `<div class="nav-section-label">${item.section}</div>`;
          return `<button class="nav-item ${state.tab === item.id ? "active" : ""}" onclick="navigate('${item.id}')">
      <span class="icon">${item.icon}</span>${item.label}
    </button>`;
        }).join("");

        const modalHtml = state.modal
          ? `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">${state.modal}</div>
    </div>`
          : "";

        const confirmHtml = state.confirmDialog
          ? `
    <div class="modal-backdrop">
      <div class="modal confirm-dialog">
        <div class="modal-header">
          <div class="modal-title">${state.confirmDialog.title}</div>
        </div>
        <p style="color:var(--text-secondary);font-size:13.5px;line-height:1.6">${state.confirmDialog.msg}</p>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="state.confirmDialog.onCancel()">Cancel</button>
          <button class="btn btn-danger" onclick="state.confirmDialog.onConfirm()">Confirm Delete</button>
        </div>
      </div>
    </div>`
          : "";

        const toastHtml = state.toast
          ? `<div class="toast ${state.toast.type}">${state.toast.msg}</div>`
          : "";

        document.getElementById("app").innerHTML = `
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">ER</div>
        <div><div class="logo-text">Escape Room ERP</div><div class="logo-sub">CSE 4/560 — DMQL</div></div>
      </div>
      <nav class="sidebar-nav">${navHtml}</nav>
      <div class="sidebar-footer">
        <div class="db-badge">
          <div class="db-dot"></div>
          <span>PostgreSQL</span>
        </div>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title">${PAGE_TITLES[state.tab] || ""}</div>
        <div class="topbar-right">
          <span style="font-size:12px;color:var(--text-muted)">Escape Room ERP v1.0</span>
        </div>
      </div>
      <div class="content">${renderPage()}</div>
    </div>
    ${modalHtml}${confirmHtml}${toastHtml}`;

        // Restore query editor content
        if (state.tab === "playground") {
          const editor = document.getElementById("query-editor");
          if (editor && playgroundState.editorContent)
            editor.value = playgroundState.editorContent;
          if (editor)
            editor.addEventListener("input", () => {
              playgroundState.editorContent = editor.value;
            });
        }
      }

      // ── Export CSV utility ────────────────────────────────────────────────────────
      window.exportTable = function (name) {
        const state_map = { customers: customersState, employees: empState };
        const s = state_map[name];
        if (!s || !s.data) return showToast("No data to export", "error");
        const rows = s.data;
        const keys = Object.keys(rows[0]);
        const csv = [
          keys.join(","),
          ...rows.map((r) =>
            keys.map((k) => JSON.stringify(r[k] ?? "")).join(","),
          ),
        ].join("\n");
        const a = document.createElement("a");
        a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
        a.download = `${name}_export.csv`;
        a.click();
        showToast(`${rows.length} rows exported`);
      };

      // ── Init ─────────────────────────────────────────────────────────────────────
      render();
    </script>
  </body>
</html>
